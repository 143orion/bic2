# À chaque push sur main : tests (règles Firestore sur l'émulateur + parcours du site
# sur le simulateur), puis publication du dossier site/ sur GitHub Pages.
# Si un test échoue, rien n'est publié : le site en ligne reste l'ancienne version.
name: Tests et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Règles Firestore (émulateur)
        run: npm run test:regles
      - name: Parcours du site (simulateur, ordi + téléphone)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/captures.mjs
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/captures/
          retention-days: 7

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
