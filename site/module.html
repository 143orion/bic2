/* ---------- écran de fin (commun aux 3 modes) ---------- */
const ordreLog = log => log.filter(l => !l.nt);
function donneeTxt(l){ return l.donnee ? esc(l.donnee) : "—"; }
function enonceLog(l){
  const it = l.it, e = l.etape != null && it.etapes ? it.etapes[l.etape] : null;
  if(it.type === "trous"){ let k = 0; return md(it.enonce).replace(/\[_\]/g, () => `<span class="trou-fin">${esc((String(l.donnee || "").split(" · ")[k++]) || "…")}</span>`); }
  return e ? `<p class="rv-ctx">${riche(it.titre ? it.titre + " — " : "")}${md(it.enonce).replace(/^<p>|<\/p>$/g, "")}</p>${md(e.question || e.consigne || "")}` : md(it.enonce);
}
function attenduLog(l){
  const it = l.it, e = l.etape != null && it.etapes ? it.etapes[l.etape] : null, v = (e ? e.verif : it.verif) || {};
  if(it.type === "qcm" || it.type === "qcm-multi"){ const att = [].concat((it.verif && it.verif.attendu) ?? it.bonnes ?? it.bonne ?? []); return att.map(a => mdInline((it.choix || [])[typeof a === "number" ? a : (it.choix || []).findIndex(c => norm(c) === norm(a))] ?? a)).join(" · "); }
  if(it.type === "trous") return [].concat(v.attendu || []).map(mdInline).join(" · ");
  return corrigeDe(e || it, v);
}
function ecranFin(zone, sess, opts = {}){
  S.touches = null;
  const L2 = ordreLog(sess.log), n = L2.length, ok = L2.filter(l => l.ok).length, ko = n - ok, pc = n ? Math.round(ok/n*100) : 0;
  let best = 0, cur = 0; L2.forEach(l => { if(l.ok){ cur++; best = Math.max(best, cur); } else cur = 0; });
  const fix = L2.filter(l => l.ok && (l.etape == null ? sess.avant.q[l.it.id] : (sess.avant.ex[l.it.id] || []).includes(l.etape))).length;
  const kst = L2.filter(l => !l.ok && l.etape != null).length, kq = ko - kst;
  const temps = (() => { const t = Math.max(0, Math.round(((sess.t1 || Date.now()) - sess.t0)/1000)); return `${Math.floor(t/60)}:${String(t % 60).padStart(2, "0")}`; })();
  const verdict = pc === 100 ? "Sans faute." : pc >= 70 ? "Bien joué, la base est là." : pc >= 40 ? "À consolider : refais une série pour fixer." : "On reprend tranquillement, c'est normal au début.";
  const note = ko ? [kq ? `${kq} question${kq > 1 ? "s" : ""} à rattraper : Express ${kq > 1 ? "les" : "la"} reprendra en premier.` : "", kst ? `${kst} étape${kst > 1 ? "s" : ""} d'exo à rattraper : l'exo rouvrira en Classique, étape en évidence.` : ""].filter(Boolean).join(" ") : "Aucune erreur à rattraper.";
  const lab = {express:"Série terminée", classique:"Exo terminé", mock:"Copie rendue"}[sess.mode];
  const dispo = m => { const s = selection(); return m === "express" ? s.courts.length > 0 : m === "classique" ? s.exos.length > 0 : (s.exos.length + s.saisies.length > 0 || !!S2.fl.annale); };
  const autres = ["express", "classique", "mock"].filter(m => m !== sess.mode).map(m => `<button type="button" class="btn" data-m="vers" data-v="${m}" ${dispo(m) ? "" : "disabled"}>${{express:"Questions rapides", classique:"Exo rédigé", mock:"Mock"}[m]}</button>`).join("");
  const r = M.etat() || {}, deb = r.xpDebut || 0, suiv = r.xpSuivant || 1, tot = r.total || 0, avant = Math.max(deb, tot - sess.xp);
  const w1 = Math.round(100*(avant - deb)/Math.max(1, suiv - deb)), w2 = Math.round(100*(tot - avant)/Math.max(1, suiv - deb));
  const encore = {express:"Nouvelle série", classique:opts.nbExos > 1 ? "Autre exo" : "Refaire cet exo", mock:"Nouveau mock"}[sess.mode];
  S2.suite = opts.suivant || (() => sess.mode === "express" ? sessionExpress() : sess.mode === "classique" ? sessionClassique(0) : sessionMock());
  zone.innerHTML = `<div class="fin">
    <div class="fin-bloc"><div class="fin-g"><p class="fl-k">${lab}</p><p class="fin-score">${ok}<small>/${n}</small></p><p class="fin-verdict">${verdict}</p><p class="vide-txt">${note}</p>
      <div class="fin-btns"><div class="actions"><button type="button" class="btn plein" data-m="encore">${encore}</button><button type="button" class="btn" data-m="quit">Retour au menu</button></div>
      <div class="fin-autres"><span class="vide-txt">Essayer un autre mode sur les mêmes notions</span><div class="actions">${autres}</div></div></div></div>
      <div class="fin-d">${sess.xp > 0 ? `<div class="fin-xp"><span>XP gagnée</span><b>+${nf(sess.xp)}</b><small class="vide-txt">Les bonus (précision, endurance, série) sont crédités au bilan de session.</small></div>` : ""}
        <div class="fin-stats"><div><b>${pc} %</b><span>Précision</span></div><div><b>${temps}</b><span>Temps</span></div><div><b>${fix}</b><span>Erreurs rattrapées</span></div><div><b>${best}</b><span>Meilleure série</span></div></div>
        <div class="fin-niv"><span class="vide-txt">Niveau ${r.niveau ?? 0} → ${(r.niveau ?? 0) + 1}</span><div class="fin-barre"><i style="width:${w1}%"></i><i class="g" style="width:${w2}%"></i></div><span class="vide-txt mono">${nf(tot)} / ${nf(suiv)} XP</span></div></div></div>
    <section class="rev"><h3>Correction détaillée <span class="pastille">${sess.log.length} question${sess.log.length > 1 ? "s" : ""}</span></h3>
    ${sess.log.map((l, k) => `<article class="rv ${l.nt ? "nt" : l.ok ? "ok" : "ko"}"><div class="rv-h"><span class="rv-n">${k + 1}</span>${l.it._n ? `<span class="pastille">${esc(titreNotion(l.it._n))}</span>` : ""}<span class="rv-s">${l.nt ? "Non traité" : l.ok ? "Juste" : "Raté"}</span></div>
      <div class="rv-q">${enonceLog(l)}</div>
      <div class="rv-a"><div><span>Ta réponse</span><b class="${l.ok ? "g" : "b"}">${donneeTxt(l)}</b></div>${l.ok ? "" : `<div><span>Bonne réponse</span><b class="g">${attenduLog(l) || "—"}</b></div>`}</div>
      ${(l.etape != null ? ((l.it.etapes[l.etape] || {}).explication) : l.it.explication) ? `<div class="explication">${md(l.etape != null ? l.it.etapes[l.etape].explication : l.it.explication)}</div>` : (l.etape != null && l.it.etapes[l.etape].corrige ? `<div class="explication">${md(l.it.etapes[l.etape].corrige)}</div>` : "")}
      <div class="rv-pied">${lienSignaler(l.it.id)}</div></article>`).join("")}</section></div>`;
  scrollTo(0, 0);
}

/* =====================================================================
   ACTIONS (délégation de clics sur le lecteur)
   ===================================================================== */
const ACT = {
  tab: b => { S2.tab = b.dataset.v; if(S2.tab === "exos") { S2.fl.etape = 1; } vueModule(); },
  sub: b => { S2.sub = b.dataset.v; vueModule(); },
  reprendre: () => { const n = progression().suivante; if(n) allerNotion(n.id); },
  cf: b => allerNotion(b.dataset.id),
  som: b => allerNotion(b.dataset.id),
  eng: b => { const n = S.notions.find(x => ckId(x) === b.dataset.id); if(!n || lue(n)) return; S2.eng = b.dataset.id; majCarte(n, "expl"); },
  ck: b => { const n = S.notions.find(x => ckId(x) === b.dataset.id); if(!n) return;
    if(S2.sub === "expl" && S2.eng !== b.dataset.id){ S2.eng = b.dataset.id; majCarte(n, "expl"); return; }
    repondreCheck(n, +b.dataset.i); },
  retry: b => { const n = S.notions.find(x => ckId(x) === b.dataset.id); if(!n) return; delete S2.chkV[b.dataset.id]; S2.ord[b.dataset.id] = null; if(S2.sub === "expl") S2.eng = b.dataset.id; if(S2.sub === "follow") vueModule(); else majCarte(n, "expl"); },
  train: b => { S2.tab = "exos"; S2.fl.pick = new Set([b.dataset.id]); S2.fl.mode = "express"; S2.fl.etape = 2; sessionExpress(); },
  fa: b => { S2.fa = S.notions.findIndex(n => n.id === b.dataset.id); S2.fs = 0; vueModule(); },
  fnext: () => { S2.fs++; vueModule(); },
  fprev: () => { S2.fs = Math.max(0, S2.fs - 1); vueModule(); },
  fback: () => { S2.fa = null; vueModule(); },
  pk: b => { const p = S2.fl.pick, id = b.dataset.id; p.has(id) ? p.delete(id) : p.add(id); rendreExos($("m-corps")); },
  pch: b => { const c = S.chapitres.find(x => x.id === b.dataset.id), ids = c.notions.map(n => n.id), tout = ids.every(i => S2.fl.pick.has(i)); ids.forEach(i => tout ? S2.fl.pick.delete(i) : S2.fl.pick.add(i)); rendreExos($("m-corps")); },
  pall: () => { S.notions.forEach(n => S2.fl.pick.add(n.id)); rendreExos($("m-corps")); },
  pnone: () => { S2.fl.pick.clear(); rendreExos($("m-corps")); },
  perr: () => { const st = etats(), ee = erreursExos(); S2.fl.pick = new Set(S.notions.filter(n => statNotion(n, st, ee).err).map(n => n.id)); rendreExos($("m-corps")); },
  exsuiv: () => { if(!S2.fl.pick.size) return; S2.fl.etape = 2; rendreExos($("m-corps")); scrollTo(0, 0); },
  exprec: () => { S2.fl.etape = 1; rendreExos($("m-corps")); },
  mode: b => { S2.fl.mode = b.dataset.v; rendreExos($("m-corps")); },
  gtog: () => { S2.fl.guide = !S2.fl.guide; S2.fl.mode = "classique"; rendreExos($("m-corps")); },
  annale: b => { S2.fl.annale = b.dataset.id || null; S2.fl.mode = "mock"; rendreExos($("m-corps")); },
  go: () => lancerSession(),
  quit: () => { S2.tab = "exos"; S2.fl.etape = 2; vueModule(); },
  vers: b => { S2.fl.mode = b.dataset.v; S2.tab = "exos"; S2.fl.etape = 2; vueModule(); },
  encore: () => { if(S2.suite) S2.suite(); }
};
L.addEventListener("click", e => { const b = e.target.closest("[data-m]"); if(b && ACT[b.dataset.m]) ACT[b.dataset.m](b, e); });
L.addEventListener("keydown", e => { if((e.key === "Enter" || e.key === " ") && e.target.matches("[data-m][tabindex]")){ e.preventDefault(); e.target.click(); } });


/* mock / classique : énoncé + schéma + toutes les questions courtes ; chrono seulement en mock ; une réponse au moteur par étape */
function jouerMock(it, zone, opts = {}){
  return new Promise(resolve => {
    const run = M.debutExo(it.id);
    S.nettoyer = () => M.finExo(it.id);
    const etapes = (it.etapes && it.etapes.length) ? it.etapes : [{question:"Réponse", verif:it.verif, corrige:it.corrige}];
    const n = etapes.length, ctx = {module:S.mod.id, chapitre:S.chapDe[it.id]}, dTot = dureeExo(it), t0 = Date.now();
    const mode = opts.mode || "mock", avecChrono = opts.chrono !== false && !opts.examen;
    zone.innerHTML = `<article class="q exo mock">
      ${teteItem(it, opts, `<span class="q-duree">${ic("timer")} ${minutes(dTot)} · ${n} question${n > 1 ? "s" : ""}</span>`)}
      ${it.titre ? `<h3 class="exo-titre">${mdInline(it.titre)}</h3>` : ""}
      <div class="mock-grille"><div><div class="q-enonce">${md(it.enonce)}</div>${it.schema ? SV.rendre(it.schema) : ""}</div>
      <div class="mock-copie">${avecChrono ? `<div class="chrono-mock" role="timer"></div>` : ""}<ol class="mock-qs"></ol>
      <div class="actions"><button type="button" class="btn plein" data-a="rendre">Rendre la copie</button>${opts.relancer ? `<button type="button" class="btn" data-a="de">${ic("dice")} Autres valeurs</button>` : ""}</div>
      <div class="q-retour" hidden></div></div></div>
      <div class="actions q-actions">${lienSignaler(it.id)}</div></article>`;
    const art = zone.firstElementChild, ol = art.querySelector(".mock-qs"), ret = art.querySelector(".q-retour"), chrono = art.querySelector(".chrono-mock");
    const champs = etapes.map((e, k) => {
      const li = document.createElement("li"), rat = opts.aRattraper && opts.aRattraper.includes(k);
      if(rat) li.classList.add("a-rattraper");
      li.innerHTML = `${rat ? `<span class="pastille todo">À rattraper · ×${fmt(V().rattrapage)}</span>` : ""}<div class="mq-lib">${md(e.question || e.consigne || `Question ${k+1}`)}</div><div class="q-corps"></div><div class="mq-ret"></div>`;
      ol.appendChild(li);
      return creerChamp(li.querySelector(".q-corps"), e.verif || {mode:"auto"}, Object.assign({}, e, {ctx}));
    });
    if(avecChrono){
      const tic = () => { const s = Math.round((Date.now() - t0)/1000), r = dTot*60 - s; chrono.textContent = `${r >= 0 ? "" : "+"}${Math.floor(Math.abs(r)/60)}:${String(Math.abs(r) % 60).padStart(2, "0")}`; chrono.classList.toggle("urgent", r < 60); };
      tic(); S.chrono = setInterval(tic, 1000);
    }
    let rendu = false;
    const rendre = async () => {
      if(rendu) return; rendu = true; if(avecChrono){ clearInterval(S.chrono); S.chrono = 0; }
      art.querySelectorAll("[data-a]").forEach(b => b.disabled = true);
      const secs = (Date.now() - t0)/1000/n; let nOk = 0, xp = 0;
      for(let k = 0; k < n; k++){
        const e = etapes[k], v = e.verif || {mode:"auto"}, ch = champs[k];
        const r = v.mode && v.mode !== "auto" ? await verifier(v, ch.lire(), ctx, ch) : {ok:false};
        const d = M.reponse(it.id, !!r.ok, secs, {etape:k, indices:0, run, mode});
        if(opts.log) opts.log.push({it, etape:k, donnee:ch.lire(), ok:!!r.ok});
        if(r.ok){ nOk++; if(d && d.ok) xp += d.xp + d.bonus; }
        ch.el.readOnly = true; ch.el.classList.add(r.ok ? "juste" : "faux");
        ol.children[k].querySelector(".mq-ret").innerHTML = r.ok ? `<b class="ok-txt">✓</b>` : `<div class="corrige"><small>Correction</small>${corrigeDe(e, v) || md(e.explication || "")}</div>${r.msg ? `<small class="aide">${esc(r.msg)}</small>` : ""}`;
      }
      M.finExo(it.id); S.nettoyer = null;
      if(opts.examen){ resolve({ok:nOk === n, partiel:nOk, n, xp}); return; }   /* mock : les corrections sont à l'écran de fin */
      ret.hidden = false; ret.className = "q-retour " + (nOk === n ? "ok" : "ko");
      ret.innerHTML = `<b class="verdict">${nOk === n ? "✓ Copie parfaite" : `${nOk}/${n} juste${nOk > 1 ? "s" : ""}`} <small>+${nf(xp)} XP</small></b>${it.explication ? `<div class="explication">${md(it.explication)}</div>` : ""}`;
      const act = art.querySelector(".mock-copie .actions");
      act.innerHTML = `<button type="button" class="btn plein" data-a="fin">Terminer</button>${opts.relancer ? `<button type="button" class="btn" data-a="de">${ic("dice")} Même exo, autres valeurs</button>` : ""}`;
      act.querySelector("[data-a=fin]").onclick = () => resolve({ok:nOk === n, partiel:nOk, n, xp});
      const bd = act.querySelector("[data-a=de]"); if(bd) bd.onclick = () => { resolve({relance:true}); opts.relancer(); };
    };
    art.querySelector("[data-a=rendre]").onclick = rendre;
    const bd = art.querySelector("[data-a=de]"); if(bd) bd.onclick = () => { M.finExo(it.id); S.nettoyer = null; resolve({relance:true}); opts.relancer && opts.relancer(); };
    if(champs[0]) champs[0].focus();
  });
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
const idMod = decodeURIComponent(location.hash.slice(1));
addEventListener("hashchange", () => location.reload());
const liste = await fetch("modules/liste.json").then(r => r.ok ? r.json() : []).catch(() => []);
const mod = Array.isArray(liste) && liste.find(m => m.id === idMod);
S.mod = mod ? Object.assign({}, mod) : {id:idMod || "?", nom:"Module introuvable"};
document.title = S.mod.nom + " · BIC2.exe";
if(mod) appliquerTheme(mod.theme);
M.monterHeader({page:"module", module:{id:S.mod.id, nom:((S.mod.icone ? S.mod.icone + " " : "") + S.mod.nom)}});
const pInit = M.init({module:S.mod.id});

if(!mod){
  await pInit;
  L.innerHTML = `<section class="fenetre l-vide" data-titre="erreur.log"><p><b>Module « ${esc(idMod || "(aucun)")} » introuvable.</b></p>
    <p class="vide-txt">Il n'est pas (encore) dans modules/liste.json.</p><div class="actions"><a class="btn" href="index.html#modules">Retour au hub</a></div></section>`;
  return;
}
if(mod.ext){   /* extension du module : modèles de schémas, générateurs de variantes, labos */
  await new Promise(res => { const sc = document.createElement("script"); sc.src = `modules/${mod.id}.js`; sc.onload = sc.onerror = res; document.head.appendChild(sc); });
  const x = window.EXT_MODULE || {}; ["schemas","generateurs","labos"].forEach(k => Object.assign(EXT[k], x[k] || {}));
}
const chs = await Promise.all((mod.chapitres || []).map(ch => fetch(`banques/${mod.id}/${ch}.json`).then(r => r.ok ? r.json() : null).catch(() => null)));
S.chapitres = chs.filter(Boolean).sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0));
for(const c of S.chapitres){
  c.module = c.module || mod.id;
  normaliser(c);
  M.charger(c);
  for(const it of c.items || []){ S.items[it.id] = it; S.chapDe[it.id] = c.id; }
}
indexerNotions();
const manquants = (mod.chapitres || []).length - S.chapitres.length;
await pInit;
const reg = M.interne.config && M.interne.config.modules && M.interne.config.modules[mod.id];   /* icône réglée dans le panel */
if(reg && reg.icone) S.mod.icone = reg.icone;
vueModule();
if(manquants > 0) toast(`${manquants} chapitre(s) n'ont pas pu être chargés`);
let tMaj = 0;
M.on(() => { if(S.vue === "module"){ clearTimeout(tMaj); tMaj = setTimeout(majEntete, 120); } });
})();
</script>
