/* =====================================================================
   BIC2.exe — module.html : LECTEUR UNIVERSEL (module.html#<module>)
   Lit modules/liste.json + banques/<module>/<chapitre>.json (+ modules/<module>.js si ext).
   Layout baseline : 2 onglets Cours (explicatif · follow-along · TL;DR) / Exos
   (menu des notions → mode express · classique · mock → écran de session → écran de fin). Maths en LaTeX (KaTeX).
   Ne calcule jamais l'XP : tout passe par moteur.reponse() (xp.js).
   Styles : section « LECTEUR » de theme.css (D.A. du module = --m-*).
   ===================================================================== */
(async () => {
const M = window.moteur, {esc, nf, fmt, ecartJours} = M.outils;
const $ = id => document.getElementById(id);
const L = $("lecteur");
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
const petitEcran = () => matchMedia("(max-width:760px)").matches;
const V = () => M.valeursPour(M.interne.config, "9999-12-31");
const S = {mod:null, chapitres:[], items:{}, chapDe:{}, notions:[], notionParId:{}, vue:null, nettoyer:null, touches:null};
const TYPES_Q = ["qcm","qcm-multi","saisie","trous"];
const LIB = {qcm:"QCM", "qcm-multi":"QCM multi", saisie:"Réponse tapée", trous:"Code à trous", exo:"Exo", examen:"Examen blanc"};
const ORIG = {cours:"cours", td:"TD", annale:"annale", generee:"générée"};

/* ---------- petits outils ---------- */
const melanger = a => { a = a.slice(); for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’‘`]/g,"'").replace(/[“”«»]/g,'"')
  .toLowerCase().replace(/\s+/g," ").trim().replace(/[\s;.]+$/,"");
let tToast = 0;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tToast); tToast = setTimeout(() => el.classList.remove("on"), 2600); }
document.addEventListener("click", e => { if(e.target.closest("button, .retour")) M.son("tap"); });
addEventListener("keydown", e => { if(S.touches && $("m-signal").hidden && !e.target.closest("input, textarea")) S.touches(e); });

/* mini-markdown sûr : ```blocs``` (```c colorés), `code`, **gras**, listes « - » et « 1. », tableaux « | a | b | »,
   encadrés « > **Piège** : … » (piège / à retenir / astuce / exemple / attention), intertitres « ### », paragraphes */
function mdInline(t){
  const codes = [];
  t = String(t ?? "").replace(/`([^`\n]+)`/g, (_, c) => (codes.push(c), `\u0001${codes.length-1}\u0001`));
  t = esc(t).replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  return t.replace(/\u0001(\d+)\u0001/g, (_, k) => `<code>${esc(codes[k])}</code>`);
}

/* ---- coloration syntaxique C (palette VS Code Dark+) ---- */
const C_MOTS = new Set("if else for while do switch case break continue return default goto sizeof".split(" "));
const C_TYPES = new Set("int char float double void long short unsigned signed const static struct enum typedef union extern bool size_t FILE".split(" "));
const C_CONST = new Set("NULL true false EOF stdin stdout stderr".split(" "));
const RE_C = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|(?![\s\S])))|("(?:\\.|[^"\\\n])*"?)|('(?:\\.|[^'\\\n])*'?)|(^[ \t]*#[ \t]*include[ \t]*<[^>\n]*>?)|(^[ \t]*#[ \t]*[a-z]+)|(\b0[xX][0-9a-fA-F]+\b|\b\d+(?:\.\d*)?(?:[eE][+-]?\d+)?[uUlLfF]*\b|\B\.\d+\b)|([A-Za-z_]\w*)/gm;
function hlChaine(t){
  return esc(t).replace(/(\\[ntr0'"\\abfv]|\\x[0-9a-fA-F]+)|(%[-+ #0]*(?:\d+|\*)?(?:\.(?:\d+|\*))?(?:hh|h|ll|l|L|z)?[diouxXfFeEgGcsp%])/g,
    (m, e, f) => e ? `<span class="tk-e">${m}</span>` : `<span class="tk-fmt">${m}</span>`);
}
function hlC(code){
  code = String(code ?? "");
  let out = "", i = 0, m;
  RE_C.lastIndex = 0;
  while((m = RE_C.exec(code))){
    if(m[0] === ""){ RE_C.lastIndex++; continue; }
    out += esc(code.slice(i, m.index)); i = m.index + m[0].length;
    const x = m[0];
    if(m[1]) out += `<span class="tk-cm">${esc(x)}</span>`;
    else if(m[2] || m[3]) out += `<span class="tk-s">${hlChaine(x)}</span>`;
    else if(m[4]){ const k = x.indexOf("<"); out += `<span class="tk-p">${esc(x.slice(0, k))}</span><span class="tk-s">${esc(x.slice(k))}</span>`; }
    else if(m[5]) out += `<span class="tk-p">${esc(x)}</span>`;
    else if(m[6]) out += `<span class="tk-n">${esc(x)}</span>`;
    else {
      const suite = code.slice(i).match(/^\s*\(/);
      const cls = C_MOTS.has(x) ? "tk-k" : C_TYPES.has(x) ? "tk-t" : C_CONST.has(x) ? "tk-cst"
        : /^[A-Z][A-Z0-9_]+$/.test(x) ? "tk-cst" : suite ? "tk-f" : /^[A-Z]/.test(x) ? "tk-ty" : "tk-v";
      out += `<span class="${cls}">${esc(x)}</span>`;
    }
  }
  return out + esc(code.slice(i));
}
function blocCode(lang, c){
  c = c.replace(/\n$/, "");
  const estC = /^(c|h)$/i.test(lang || "");
  return `<div class="bloc-code${estC ? " lang-c" : ""}">${lang ? `<span class="bc-lang">${esc(lang.toUpperCase())}</span>` : ""}<button type="button" class="bc-copier" data-copier aria-label="Copier le code">${ic("copy")}</button><pre class="code"><code>${estC ? hlC(c) : esc(c)}</code></pre></div>`;
}
const ENCADRES = {"piège":"piege", "piege":"piege", "attention":"piege", "à retenir":"retenir", "a retenir":"retenir", "retenir":"retenir", "astuce":"astuce", "exemple":"exemple", "méthode":"astuce", "remarque":"exemple"};
function encadre(lignes){
  const txt = lignes.map(l => l.replace(/^\s*>\s?/, "")).join("\n");
  const m = txt.match(/^\*\*([^*]+)\*\*\s*:?\s*/);
  const cle = m ? m[1].trim().toLowerCase() : "";
  const type = ENCADRES[cle] || "note";
  const titre = m && ENCADRES[cle] ? m[1].trim() : "";
  let corps = titre ? txt.slice(m[0].length) : txt;
  if(titre) corps = corps.charAt(0).toUpperCase() + corps.slice(1);
  const icone = {piege:"alert", retenir:"check", astuce:"bulb", exemple:"code", note:"info"}[type];
  return `<div class="encadre enc-${type}"><div class="enc-tete">${ic(icone)}${titre ? `<b>${esc(titre)}</b>` : ""}</div><div class="enc-corps">${md(corps)}</div></div>`;
}
function tableau(lignes){
  const cel = l => l.trim().replace(/\\\|/g, "\u0003").replace(/^\||\|$/g, "").split("|").map(c => c.trim().replace(/\u0003/g, "|"));
  const sep = lignes[1] && /^\s*\|?\s*:?-{2,}/.test(lignes[1]);
  const tete = sep ? cel(lignes[0]) : null, corps = (sep ? lignes.slice(2) : lignes).map(cel);
  return `<div class="md-table-wrap"><table class="md-table">${tete ? `<thead><tr>${tete.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${corps.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function md(s){
  if(Array.isArray(s)) s = s.join("\n");
  const blocs = [];
  const t = String(s ?? "").replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, c) => (blocs.push(blocCode(lang, c)), `\n\u0002${blocs.length-1}\u0002\n`));
  const out = [];
  for(const para of t.split(/\n\s*\n/)){
    const lignes = para.split("\n").filter(l => l.trim() !== "");
    if(!lignes.length) continue;
    if(lignes.every(l => /^\s*>/.test(l))){ out.push(encadre(lignes)); continue; }
    let html = "", liste = "", texte = [], tab = [];
    const vider = () => { if(texte.length){ html += `<p>${texte.join("<br>")}</p>`; texte = []; } };
    const fermer = () => { if(liste){ html += `</${liste}>`; liste = ""; } };
    const finTab = () => { if(tab.length){ html += tableau(tab); tab = []; } };
    for(const l of lignes){
      const b = l.match(/^\u0002(\d+)\u0002$/);
      const li = l.match(/^\s*[-•]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/), h = l.match(/^\s*#{2,4}\s+(.*)$/);
      if(/^\s*\|.*\|\s*$/.test(l)){ vider(); fermer(); tab.push(l); continue; }
      finTab();
      if(b){ vider(); fermer(); html += blocs[b[1]]; }
      else if(h){ vider(); fermer(); html += `<h4 class="md-h">${mdInline(h[1])}</h4>`; }
      else if(li || ol){ const tg = li ? "ul" : "ol"; vider(); if(liste !== tg){ fermer(); html += `<${tg}>`; liste = tg; } html += `<li>${mdInline((li || ol)[1])}</li>`; }
      else { fermer(); texte.push(mdInline(l)); }
    }
    finTab(); vider(); fermer();
    out.push(html);
  }
  return out.join("");
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copier]"); if(!b) return;
  const code = b.parentElement.querySelector("pre code");
  try{ await navigator.clipboard.writeText(code ? code.textContent : ""); toast("Code copié ✓"); }catch(err){ toast("Copie impossible ici : sélectionne le code à la main"); }
});

/* ---------- D.A. du module : variables --m-* + police Google ---------- */
function appliquerTheme(t = {}){
  const r = document.documentElement.style;
  if(t.bg) r.setProperty("--m-bg", t.bg);
  if(t.fg) r.setProperty("--m-fg", t.fg);
  if(t.ac) r.setProperty("--m-ac", t.ac);
  if(t.onAc) r.setProperty("--m-on-ac", t.onAc);
  if(t.font) r.setProperty("--m-font", t.font);
  if(t.googleFont){
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + String(t.googleFont).trim().replace(/\s+/g,"+") + "&display=swap";
    document.head.appendChild(l);
  }
}


/* =====================================================================
   SCHÉMAS SVG (circuits…) — format des banques : schema = {modele, vals, surligne, eteint, court}
   ou {vb:"x y w h", el:[…]} ; les modèles viennent du fichier d'extension du module.
   Éléments : ["w",[[x,y]…]] fil · ["n",x,y] nœud · ["t",x,y,"txt",{a,cls}] texte
              ["R",x1,y1,x2,y2,{id,label,val,lp}] résistance · ["S",x1,y1,x2,y2,{id,kind:"E"|"I",label,val,lp}] source (flèche de 1 vers 2)
              ["a",x1,y1,x2,y2,"label",lx,ly] flèche de tension/courant
   ===================================================================== */
const EXT = {schemas:{}, generateurs:{}, labos:{}};
const SV = {
  ml(s){ /* étiquette façon LaTeX : R1 → R₁ italique, Eth → E_th */
    s = String(s ?? ""); const m = /^([A-Za-z])_?([A-Za-z0-9]{1,3})?$/.exec(s);
    if(!m) return esc(s);
    const sub = m[2] || "";
    return `<tspan class="mi">${m[1]}</tspan>` + (sub ? `<tspan class="${/^\d+$/.test(sub) ? "sb" : "sbi"}" dy="4">${esc(sub)}</tspan>` : "");
  },
  line: pts => `<polyline class="w" points="${pts.map(p => p.join(",")).join(" ")}"/>`,
  geo(x1, y1, x2, y2, L){
    const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, ux = dx/l, uy = dy/l, cx = (x1+x2)/2, cy = (y1+y2)/2;
    return {cx, cy, ux, uy, h:Math.abs(dy) < Math.abs(dx), ang:Math.atan2(dy, dx)*180/Math.PI,
      leads:SV.line([[x1,y1],[cx-ux*L, cy-uy*L]]) + SV.line([[cx+ux*L, cy+uy*L],[x2,y2]])};
  },
  labels(g, o, defLp){
    const lp = o.lp || defLp, anc = lp === "right" ? "start" : lp === "left" ? "end" : "middle";
    const src = !!o.kind, dh = src ? 17 : 0;   /* une source est un cercle de rayon 16 : on écarte les étiquettes */
    const lx = g.h ? g.cx : g.cx + (lp === "left" ? -1 : 1) * (src ? 24 : 14), ly = g.h ? (lp === "bottom" ? g.cy + 24 + dh : g.cy - 13 - dh - (o.kind === "I" ? 8 : 0)) : g.cy - 3;
    const vy = g.h ? (lp === "bottom" ? g.cy + 38 + dh : g.cy + 22 + dh) : g.cy + 13;
    return (o.label ? `<text x="${lx}" y="${ly}" text-anchor="${anc}">${SV.ml(o.label)}</text>` : "")
      + (o.val != null && o.val !== "" ? `<text class="val" x="${lx}" y="${vy}" text-anchor="${anc}">${esc(o.val)}</text>` : "");
  },
  R(x1, y1, x2, y2, o = {}){
    const g = SV.geo(x1, y1, x2, y2, 20);
    return `<g class="comp" data-id="${esc(o.id || "")}">${g.leads}<rect class="body" x="-20" y="-7" width="40" height="14" transform="translate(${g.cx} ${g.cy}) rotate(${g.ang})"/>${SV.labels(g, o, g.h ? "top" : "right")}</g>`;
  },
  S(x1, y1, x2, y2, o = {}){
    const g = SV.geo(x1, y1, x2, y2, 16), T = `transform="translate(${g.cx} ${g.cy}) rotate(${g.ang})"`;
    const inner = o.kind === "I"
      ? `<g ${T}><line class="w" x1="0" y1="-16" x2="0" y2="16"/><line class="w" x1="-9" y1="-25" x2="8" y2="-25"/><path class="node" d="M13,-25 L6,-29 L6,-21Z"/></g>`
      : `<g ${T}><line class="w" x1="-10" y1="0" x2="7" y2="0"/><path class="node" d="M13,0 L5,-4.5 L5,4.5Z"/></g>`;
    return `<g class="comp src" data-id="${esc(o.id || "")}">${g.leads}<circle class="body" cx="${g.cx}" cy="${g.cy}" r="16"/>${inner}${SV.labels(g, Object.assign({kind:"E"}, o), g.h ? "top" : "left")}</g>`;
  },
  arrow(x1, y1, x2, y2, lab, lx, ly){
    const a = Math.atan2(y2-y1, x2-x1), s = 7;
    return `<g class="fl"><line class="arr" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><path class="arrh" d="M${x2},${y2} L${x2-s*Math.cos(a-.45)},${y2-s*Math.sin(a-.45)} L${x2-s*Math.cos(a+.45)},${y2-s*Math.sin(a+.45)}Z"/>`
      + (lab ? `<text x="${lx ?? (x1+x2)/2}" y="${ly ?? (Math.min(y1,y2) - 8)}" text-anchor="middle">${SV.ml(lab)}</text>` : "") + `</g>`;
  },
  rendre(sc, etat = {}){
    if(!sc) return "";
    let base = sc;
    if(sc.modele){
      const f = EXT.schemas[sc.modele];
      if(!f) return `<p class="vide-txt">(schéma « ${esc(sc.modele)} » indisponible)</p>`;
      base = f(sc.vals || {});
    }
    const st = Object.assign({surligne:[], eteint:[], court:[]}, sc.modele ? {surligne:sc.surligne || [], eteint:sc.eteint || [], court:sc.court || []} : {}, etat);
    const inL = (l, id) => id && (l || []).includes(id);
    const parts = (base.el || []).map(e => {
      const [t, ...a] = e, o = (t === "R" || t === "S") ? (a[4] || {}) : {};
      if(t === "w") return SV.line(a[0]);
      if(t === "n") return `<circle class="node" cx="${a[0]}" cy="${a[1]}" r="3.2"/>`;
      if(t === "t") return `<text x="${a[0]}" y="${a[1]}" text-anchor="${(a[3] && a[3].a) || "middle"}" class="${(a[3] && a[3].cls) || ""}">${SV.ml(a[2])}</text>`;
      if(t === "a") return SV.arrow(...a);
      if(inL(st.court, o.id)){ const g = SV.geo(a[0], a[1], a[2], a[3], 0); return SV.line([[a[0],a[1]],[a[2],a[3]]]) + `<text class="val" x="${g.h ? g.cx : g.cx - 10}" y="${g.h ? g.cy - 8 : g.cy}" text-anchor="${g.h ? "middle" : "end"}">${esc((o.label || "").replace(/_/g, ""))} = 0</text>`; }
      let s = t === "R" ? SV.R(...a) : t === "S" ? SV.S(...a) : "";
      if(inL(st.surligne, o.id)) s = s.replace('class="comp', 'class="comp hl');
      if(inL(st.eteint, o.id)) s = s.replace('class="comp', 'class="comp dim');
      return s;
    });
    return `<div class="schema"><svg class="circ" viewBox="${esc(base.vb || "0 0 460 215")}" role="img" aria-label="Schéma du circuit">${parts.join("")}</svg></div>`;
  }
};

/* ---------- icônes (style Lucide, SVG inline) ---------- */
const ICONES = {
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  code:'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  timer:'<path d="M10 2h4"/><path d="M12 14l3-3"/><circle cx="12" cy="14" r="8"/>',
  book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  compass:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',

  const sub = v => typeof v === "string" ? v.replace(/\[\[(\w+)\]\]/g, (m, k) => vals[k] != null ? vals[k] : m)
    : Array.isArray(v) ? v.map(sub) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, w]) => [k, sub(w)])) : v;
  const y = sub(x);
  if(g && Array.isArray(y.etapes)) y.etapes.forEach((e, k) => {
    if(g.rep && g.rep[k] != null && e.verif) e.verif = Object.assign({}, e.verif, {attendu:g.rep[k]});
    if(g.corr && g.corr[k] != null) e.corrige = g.corr[k];

}

/* =====================================================================
   VÉRIFICATIONS : exact · numerique · regex · sql · dom · auto
   ===================================================================== */
/* fraction écrite x/y (ex. 1/200) : acceptée seulement si elle ne se simplifie pas en entier */
function fraction(s){
  const f = s.match(/^([-+−]?)\s*(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)(?![\d.,]*\s*\/)/);
  if(!f) return null;
  const num = parseFloat(f[2].replace(",",".")), den = parseFloat(f[3].replace(",","."));
  if(!isFinite(num) || !isFinite(den) || den === 0) return null;
  const q = num/den;
  return {x: f[1] === "-" || f[1] === "−" ? -q : q, entier: Math.abs(q - Math.round(q)) < 1e-9, fin: f[0].length};
}
function nombre(rep, v){
  const s = String(rep ?? "").replace(/ /g," ").trim();
  const fr = fraction(s);
  if(fr && !fr.entier){
    let x = fr.x;
    if(v && v.unite){
      const apres = s.slice(fr.fin).trim(), p = apres.match(/^([pnµumkMG])/);
      const PF = {p:1e-12, n:1e-9, "µ":1e-6, u:1e-6, m:1e-3, k:1e3, M:1e6, G:1e9};
      if(p && !norm(apres).startsWith(norm(v.unite))) x *= PF[p[1]];
    }
    return x;
  }
  if(/^[-+−]?\s*\d+(?:[.,]\d+)?\s*\/\s*\d/.test(s)) return null; /* fraction entière ou /0 : pas de lecture partielle */
  const m = s.match(/[-+−]?\s*(\d+(?:[.,]\d+)?|[.,]\d+)(?:\s*[eE]\s*([-+]?\d+)|\s*[×x*]\s*10\s*\^\s*([-+−]?\d+))?/);
  if(!m) return null;
  let x = parseFloat(m[0].replace(/\s/g,"").replace("−","-").replace(",",".").replace(/[×x*]10\^/,"e"));
  if(!isFinite(x)) return null;
  if(v && v.unite){ /* préfixes SI devant l'unité attendue : 4,7 kΩ → 4700 */
    const apres = s.slice(m.index + m[0].length).trim();
    const p = apres.match(/^([pnµumkMG])/);
    const PF = {p:1e-12, n:1e-9, "µ":1e-6, u:1e-6, m:1e-3, k:1e3, M:1e6, G:1e9};
    if(p && !norm(apres).startsWith(norm(v.unite)) ) x *= PF[p[1]];
  }
  return x;
}
async function verifier(v, rep, ctx, champ){
  v = v || {mode:"auto"};
  switch(v.mode){
    case "exact": {
      const att = [].concat(v.attendu ?? []);
      return {ok: att.some(a => norm(a) === norm(rep))};
    }
    case "numerique": {
      const fr = fraction(String(rep ?? "").replace(/ /g," ").trim());
      if(fr && fr.entier) return {ok:false, msg:"Simplifie la fraction : le résultat est un nombre entier."};
      const x = nombre(rep, v);
      if(x == null) return {ok:false, msg:"Je n'ai pas trouvé de nombre dans ta réponse."};
      const a = +v.attendu, tol = v.tol != null ? +v.tol : Math.abs(a)*0.01;
      return {ok: Math.abs(x - a) <= tol + 1e-12};
    }
    case "regex": {
      const r = String(rep ?? "").trim().replace(/\s+/g," ");
      const motifs = [].concat(v.motif ?? v.attendu ?? []);
      return {ok: motifs.some(m => { try{ return new RegExp("^(?:" + m + ")$", v.flags ?? "i").test(r); }catch(e){ return false; } })};
    }
    case "sql": return verifSQL(v, rep, ctx);
    case "dom": return verifDOM(v, rep, champ);
    case "c": return verifC(v, rep);
    default: return {auto:true};
  }
}

/* ---- SQL : sql.js (SQLite) chargé seulement au besoin, base neuve à chaque exécution ---- */
let sqlP = null; const bases = {};
function chargerSQL(){
  return sqlP || (sqlP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.9.0/sql-asm.js";
    s.onload = () => window.initSqlJs().then(res, rej);
    s.onerror = () => { sqlP = null; rej(new Error("moteur SQL injoignable (réseau ?)")); };
    document.head.appendChild(s);
  }));
}
function scriptBase(v, ctx){
  const ch = S.chapitres.find(c => c.id === ctx.chapitre) || {};
  const b = v.base || ch.base;
  if(!b) return Promise.resolve("");
  if(/\b(create|insert)\b/i.test(b)) return Promise.resolve(b);
  const k = ctx.module + "/" + b;
  return bases[k] || (bases[k] = fetch(`banques/${ctx.module}/bases/${b}.sql`).then(r => r.ok ? r.text() : Promise.reject(new Error("base introuvable : " + b))));
}
async function executerSQL(v, req, ctx, controle){
  const [SQL, script] = await Promise.all([chargerSQL(), scriptBase(v, ctx)]);
  const db = new SQL.Database();
  try{
    if(script) db.run(script);
    const r = db.exec(req);
    const out = controle ? db.exec(controle) : r;
    return out.length ? out[out.length-1] : {columns:[], values:[]};
  } finally { db.close(); }
}
const cellule = x => x == null ? "NULL" : typeof x === "number" ? String(Math.round(x*1e6)/1e6) : String(x);
function tableSQL(r, max = 15){
  if(!r || !r.columns.length) return `<p class="vide-txt">Requête exécutée, aucune ligne renvoyée.</p>`;
  const lignes = r.values.slice(0, max).map(l => `<tr>${l.map(x => `<td>${esc(cellule(x))}</td>`).join("")}</tr>`).join("");
  return `<div class="sql-sortie"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${lignes}</tbody></table>
    <small>${r.values.length} ligne${r.values.length > 1 ? "s" : ""}${r.values.length > max ? ` (${max} affichées)` : ""}</small></div>`;
}
async function verifSQL(v, rep, ctx){
  let mien;
  try{ mien = await executerSQL(v, rep, ctx, v.controle); }
  catch(e){ return {ok:false, msg:"Erreur SQL : " + (e.message || e)}; }
  let ref;
  try{ ref = await executerSQL(v, v.attendu, ctx, v.controle); }
  catch(e){ return {ok:false, msg:"La requête de référence de la banque plante (" + (e.message || e) + ") : signale l'item."}; }
  const sortie = (v.controle ? `<small class="vide-txt">Contrôle : <code>${esc(v.controle)}</code></small>` : "") + tableSQL(mien);
  if(mien.columns.length !== ref.columns.length) return {ok:false, sortie, msg:`Ta requête renvoie ${mien.columns.length} colonne(s), il en faut ${ref.columns.length}.`};
  const lig = r => r.values.map(l => l.map(cellule).join("\u0003"));
  let a = lig(mien), b = lig(ref);
  if(!v.ordre){ a = a.slice().sort(); b = b.slice().sort(); }
  const ok = a.length === b.length && a.every((x, i) => x === b[i]);
  return {ok, sortie, msg: ok ? "" : a.length !== b.length ? `${a.length} ligne(s) obtenue(s), ${b.length} attendue(s).` : v.ordre ? "Bonnes lignes ? Vérifie aussi l'ordre (ORDER BY)." : "Les lignes ne correspondent pas au résultat attendu."};
}

/* ---- C : interpréteur JSCPP dans un Web Worker (vendor/c-worker.js, source dans tools/c-worker/) ----
   Le programme de l'élève est exécuté avec chaque jeu d'entrées de la banque ; on compare ce qu'il affiche. */
/* un seul worker, réutilisé (le moteur pèse ~1,2 Mo : on ne le recharge pas à chaque essai) ;
   il est tué et recréé en cas de dépassement du délai (boucle infinie) */
let wC = null, fileC = Promise.resolve(), nC = 0;
function workerC(){
  if(!wC){ try{ wC = new Worker("vendor/c-worker.js"); }catch(e){ wC = null; } }
  return wC;
}
function executerC(code, entree){
  const tache = fileC.then(() => new Promise(res => {
    const w = workerC();
    if(!w){ res({ok:false, out:"", err:"Exécuteur C indisponible dans ce navigateur."}); return; }
    const id = ++nC; let t = 0;
    const fin = r => { clearTimeout(t); w.removeEventListener("message", recu); w.removeEventListener("error", erreur); res(r); };
    const recu = e => { if(e.data && e.data.id === id) fin(e.data); };
    const erreur = () => { wC = null; w.terminate(); fin({ok:false, out:"", err:"Exécuteur C injoignable (réseau ?)."}); };
    w.addEventListener("message", recu); w.addEventListener("error", erreur);
    t = setTimeout(() => { w.terminate(); if(wC === w) wC = null; fin({ok:false, out:"", err:"Temps dépassé : boucle infinie ?"}); }, 8000);
    w.postMessage({id, code:String(code ?? ""), stdin:String(entree ?? "")});
  }));
  fileC = tache.catch(() => {});
  return tache;
}
function messageC(err){
  err = String(err || "");
  if(/Time limit exceeded/i.test(err)) return "Temps dépassé : boucle infinie ?";
  if(/sortie trop longue/.test(err)) return "Ton programme affiche sans s'arrêter : boucle infinie ?";
  const m = err.match(/Parsing Failure:\s*\n?line (\d+) \(column (\d+)\)/);
  if(m) return `Erreur de syntaxe ligne ${m[1]} (colonne ${m[2]}) : vérifie les ;, les accolades et les parenthèses.`;
  const ln = (err.match(/^(\d+):(\d+)\s/) || [])[1], ou = ln ? ` (ligne ${ln})` : "";
  let y = err.match(/^\d+:\d+\s+(.*)$/); const msg = y ? y[1] : err;
  if(/^';' expected/.test(msg)) return `Il manque un ;${ou} (ou à la fin de la ligne d'avant).`;
  y = msg.match(/^'(.+)' expected/); if(y) return `« ${y[1]} » attendu${ou} : vérifie les parenthèses, accolades et ;.`;
  y = msg.match(/VariableGet Ident: '(\w+)' is undefined/); if(y) return `${y[1]} n'existe pas${ou} : variable non déclarée, faute de frappe, fonction non définie ou #include manquant ?`;
  if(/non-pointer argument to scanf/.test(msg)) return `scanf a besoin de l'adresse de la variable${ou} : il manque le &.`;
  if(/NULL pointer dereference/.test(msg)) return `Accès à un pointeur NULL${ou} : le pointeur ne pointe sur rien.`;
  if(/no value returned/.test(msg)) return `Il manque un return${ou} : la fonction doit renvoyer une valeur.`;
  if(/invalid operation/.test(msg)) return `Opération impossible${ou} : vérifie les types des deux côtés (on ne peut pas additionner deux pointeurs, ni comparer une structure entière).`;
  if(/memory access out of bounds|accès mémoire invalide/.test(msg)) return `Accès mémoire hors limites${ou} : indice de tableau ou pointeur qui sort de la zone réservée.`;
  if(/pile d'appels saturée|out of memory/i.test(msg)) return `Mémoire de pile saturée${ou} : récursion sans cas d'arrêt ?`;
  if(/can't assign/.test(msg)) return `Affectation impossible${ou} : les types ne correspondent pas.`;
  if(/is already defined|already been defined/.test(msg)) return `Nom déjà utilisé${ou} : une variable ou fonction porte déjà ce nom.`;
  if(/^\d+:\d+\s/.test(err) && !/[éèà]/.test(msg)) return `Erreur${ou} : ${msg}`;
  if(/method main is not defined/.test(err)) return "Il n'y a pas de fonction main : elle s'écrit en minuscules, int main(void) { … }.";
  let x = err.match(/variable (\w+) does not exist/);
  if(x) return `La variable ${x[1]} n'existe pas${ou} : est-elle déclarée, et bien orthographiée ?`;
  x = err.match(/method (\w+) is not defined/);
  if(x) return `La fonction ${x[1]} n'existe pas${ou} : faute de frappe, ou #include manquant ?`;
  if(/you must return a value/.test(err)) return `Il manque un return${ou} dans une fonction qui doit renvoyer une valeur.`;
  if(/divid\w* by zero|division by zero/i.test(err)) return `Division par zéro${ou}.`;
  if(/overflow/.test(err)) return `Dépassement de capacité${ou} : la valeur ne tient pas dans le type choisi.`;
  return err.replace(/^\d+:\d+\s/, ln ? `Ligne ${ln} : ` : "");
}
const SQUELETTE_C = "#include <stdio.h>\n\nint main(void) {\n    \n    return 0;\n}";
const nombresC = s => (String(s ?? "").match(/[-+]?\d+(?:[.,]\d+)?/g) || []).map(x => +x.replace(",", "."));
function memeSortieC(a, b, v){
  if(v.nombres){
    const x = nombresC(a), y = nombresC(b), tol = v.tol != null ? +v.tol : 0.01;
    return x.length === y.length && x.every((q, i) => Math.abs(q - y[i]) <= tol + 1e-12);
  }
  const f = s => String(s ?? "").replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").replace(/\s+$/, "").replace(/[ \t]+/g, " ");
  return f(a) === f(b);
}
const blocC = (titre, txt) => `<small>${esc(titre)}</small><pre class="code"><code>${esc(String(txt ?? "") || " ")}</code></pre>`;
/* code sans commentaires ni chaînes : pour les contraintes « exige » / « interdit » de la banque */
const codeNu = c => String(c ?? "").replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g, " ").replace(/"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/g, '""');
function contraintesC(v, rep){
  const nu = codeNu(rep);
  for(const r of [].concat(v.interdit || [])) if(new RegExp(r.motif).test(nu)) return r.msg || "Ton code utilise quelque chose d'interdit par l'énoncé.";
  for(const r of [].concat(v.exige || [])) if(!new RegExp(r.motif).test(r.brut ? rep : nu)) return r.msg || "Ton code n'utilise pas ce que demande l'énoncé.";
  return "";
}
async function verifC(v, rep){
  const tests = v.tests || [];
  if(!String(rep ?? "").trim()) return {ok:false, msg:"Écris ton programme avant de valider."};
  const viol = contraintesC(v, rep);
  if(viol) return {ok:false, msg:viol};
  if(!tests.length) return {auto:true};
  for(let k = 0; k < tests.length; k++){
    const t = tests[k], r = await executerC(rep, t.entree);
    if(!r.ok) return {ok:false, msg:messageC(r.err), sortie: r.out ? `<div class="c-sortie">${blocC("Affiché avant l'erreur", r.out)}</div>` : ""};
    if(!memeSortieC(r.out, t.sortie, v)){
      return {ok:false, msg:`Test ${k + 1} / ${tests.length}${t.nom ? " (" + t.nom + ")" : ""} : la sortie ne correspond pas${v.nombres ? " (seuls les nombres affichés sont comparés)" : ""}.`,
        sortie:`<div class="c-sortie">${t.entree ? blocC("Entrée tapée", t.entree) : ""}${blocC("Ton programme affiche", r.out)}${blocC("Attendu", t.sortie)}</div>`};
    }
  }
  return {ok:true};
}

/* ---- DOM : rendu dans une iframe sans scripts, tests par sélecteurs ---- */
function majApercu(iframe, html){
  return new Promise(res => {
    if(!iframe){ res(); return; }
    const t = setTimeout(res, 800);
    iframe.onload = () => { clearTimeout(t); res(); };
    iframe.srcdoc = html;
  });
}
async function verifDOM(v, rep, champ){
  let doc = null, win = null;
  if(champ && champ.iframe){
    await majApercu(champ.iframe, rep);
    try{ doc = champ.iframe.contentDocument; win = champ.iframe.contentWindow; }catch(e){}
  }
  if(!doc || !doc.body){ doc = new DOMParser().parseFromString(rep, "text/html"); win = null; }
  const echecs = [];
  for(const t of v.tests || []){
    let els;
    try{ els = [...doc.querySelectorAll(t.sel)]; }catch(e){ echecs.push(t.msg || "Sélecteur invalide dans la banque : " + t.sel); continue; }
    const quoi = "« " + t.sel + " »";
    if(t.nb != null){ if(els.length !== +t.nb){ echecs.push(t.msg || `Il faut ${t.nb} élément(s) ${quoi}, j'en trouve ${els.length}.`); continue; } }
    else if(t.existe === false){ if(els.length){ echecs.push(t.msg || `Il ne devrait pas y avoir d'élément ${quoi}.`); } continue; }
    else if(!els.length){ echecs.push(t.msg || `Aucun élément ${quoi}.`); continue; }
    if(t.texte != null && !els.some(e => norm(e.textContent).includes(norm(t.texte)))){ echecs.push(t.msg || `${quoi} devrait contenir « ${t.texte} ».`); continue; }
    if(t.attr && !Object.entries(t.attr).every(([k, val]) => els.some(e => e.hasAttribute(k) && (val === true || norm(e.getAttribute(k)) === norm(val))))){
      echecs.push(t.msg || `${quoi} : attribut attendu ${Object.entries(t.attr).map(([k,v]) => v === true ? k : `${k}="${v}"`).join(", ")}.`); continue;
    }
    if(t.style && win){
      const sonde = doc.createElement("span"); doc.body.appendChild(sonde);
      const ok = Object.entries(t.style).every(([p, val]) => {
        sonde.style.setProperty(p, val); const voulu = win.getComputedStyle(sonde).getPropertyValue(p); sonde.style.removeProperty(p);
        return els.some(e => win.getComputedStyle(e).getPropertyValue(p) === voulu);
      });
      sonde.remove();
      if(!ok){ echecs.push(t.msg || `${quoi} : style attendu ${Object.entries(t.style).map(([k,v]) => k+": "+v).join("; ")}.`); continue; }
    }
  }
  const n = (v.tests || []).length;
  return {ok:!echecs.length, msg: echecs.length ? `${n - echecs.length}/${n} tests OK. ` + echecs[0] : ""};
}

function teteItem(it, opts = {}, extra = ""){
  return `<div class="q-tete">

    ${it._n ? `<span class="q-notion" title="${esc(titreNotion(it._n))}">${esc(it._n)}</span>` : ""}
    ${it.origine && it.origine !== "generee" ? `<span class="q-orig">${esc(ORIG[it.origine] || it.origine)}</span>` : ""}
    ${extra}
    <span class="q-pos">${opts.pos || ""}</span>
  </div>`;
}
/* champ de réponse adapté au mode de vérification */
function creerChamp(cont, v, x){
  const mode = (v && v.mode) || "auto", multi = mode === "sql" || mode === "dom" || mode === "c" || mode === "auto" || x.multiligne;
  const ph = mode === "sql" ? "SELECT …" : mode === "c" ? "#include <stdio.h>\n\nint main(void) {\n    …\n    return 0;\n}" : mode === "dom" ? "<h1>…</h1>" : mode === "numerique" ? "valeur" : "ta réponse";
  /* réponse chiffrée avec unité : bouton qui fait défiler les préfixes (A → mA → µA → kA…) */
  const unite = mode === "numerique" && !multi && v.unite ? String(v.unite) : "";
  const PREF = unite === "Ω" ? ["", "k", "M", "m"] : ["", "m", "µ", "k", "M"];
  let ip = 0;
  const champHtml = `<input class="entree" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="${esc(ph)}" aria-label="Ta réponse"${mode === "numerique" ? ' inputmode="decimal"' : ""}>`;
  cont.innerHTML = (multi
      ? (mode === "c"
        ? `<div class="code-wrap"><pre class="code-hl" aria-hidden="true"><code></code></pre><textarea class="entree code-entree code-c" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" placeholder="${esc(ph)}" aria-label="Ton programme C">${esc(x.depart || SQUELETTE_C)}</textarea></div>`
        : `<textarea class="entree code-entree" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="${esc(ph)}" aria-label="Ta réponse">${esc(x.depart || "")}</textarea>`)
      : unite ? `<span class="entree-unite">${champHtml}<button type="button" class="btn-unite" title="Changer l'unité" aria-label="Unité de la réponse : ${esc(unite)}. Cliquer pour changer"></button></span>` : champHtml)
    + (mode === "auto" ? `<small class="aide">Brouillon libre : tu compareras avec la correction et tu t'auto-évalues.</small>` : "")
    + (mode === "sql" ? `<div class="actions mini"><button type="button" class="btn" data-a="executer">Exécuter</button><small class="aide">Ctrl + Entrée pour valider</small></div><div class="sql-zone"></div>` : "")
    + (mode === "c" ? `<div class="c-run"><label class="aide">Entrée du programme (ce que tu tapes au clavier)</label><textarea class="c-stdin" rows="2" spellcheck="false" autocapitalize="off" aria-label="Entrée du programme">${esc((v.tests && v.tests[0] && v.tests[0].entree) || "")}</textarea><div class="actions mini"><button type="button" class="btn" data-a="executer">Exécuter</button><small class="aide">Ctrl + Entrée pour valider</small></div><div class="c-zone" aria-live="polite"></div></div>` : "")
    + (mode === "dom" ? `<small class="aide">Aperçu en direct (scripts désactivés)</small><iframe class="dom-apercu" sandbox="allow-same-origin" title="Aperçu de ton code"></iframe>` : "")
    + (multi && mode !== "sql" && mode !== "c" ? `<small class="aide">Ctrl + Entrée pour valider</small>` : "");
  const champ = cont.querySelector(".entree");
  const bU = cont.querySelector(".btn-unite");
  const majU = () => { bU.textContent = PREF[ip] + unite; bU.setAttribute("aria-label", "Unité de la réponse : " + PREF[ip] + unite + ". Cliquer pour changer"); };
  if(bU){
    majU();
    bU.onclick = () => { if(champ.readOnly) return; ip = (ip + 1) % PREF.length; majU(); champ.focus(); };
  }
  /* si l'élève a déjà écrit une unité lui-même (« 10 mA »), on ne rajoute rien */
  const lire = () => {
    const s = champ.value;
    return bU && s.trim() && /^[\d\s.,+\-−eE×x*^\/]+$/.test(s) ? s.trim() + " " + PREF[ip] + unite : s;
  };
  const o = {el:champ, multi, lire, focus:() => { if(!petitEcran()) champ.focus(); }, iframe:cont.querySelector("iframe")};
  if(mode === "dom"){
    let t = 0; const maj = () => majApercu(o.iframe, champ.value);
    champ.addEventListener("input", () => { clearTimeout(t); t = setTimeout(maj, 300); }); maj();
  }
  if(mode === "sql"){
    const zone = cont.querySelector(".sql-zone");
    cont.querySelector("[data-a=executer]").onclick = async () => {
      zone.innerHTML = `<p class="vide-txt">exécution…</p>`;
      try{ zone.innerHTML = tableSQL(await executerSQL(v, champ.value, x.ctx)); }
      catch(e){ zone.innerHTML = `<p class="erreur-txt">Erreur SQL : ${esc(e.message || e)}</p>`; }
    };
  }
  if(mode === "c"){
    /* coloration : un <pre> sous la zone de saisie (texte transparent), mêmes métriques, défilement synchronisé */
    const hl = cont.querySelector(".code-hl"), hlc = hl.firstElementChild;
    const metriques = () => {
      const cs = getComputedStyle(champ);
      for(const k of ["fontFamily","fontSize","lineHeight","letterSpacing","paddingTop","paddingRight","paddingBottom","paddingLeft","borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth","tabSize"]) hl.style[k] = cs[k];
    };
    const peindre = () => { hlc.innerHTML = hlC(champ.value) + "\n"; hl.scrollTop = champ.scrollTop; hl.scrollLeft = champ.scrollLeft; };
    champ.addEventListener("input", peindre);
    champ.addEventListener("scroll", () => { hl.scrollTop = champ.scrollTop; hl.scrollLeft = champ.scrollLeft; });
    if(window.ResizeObserver) new ResizeObserver(() => { metriques(); peindre(); }).observe(champ);
    const grandir = () => { champ.style.height = "auto"; champ.style.height = Math.min(Math.max(champ.scrollHeight + 4, 320), Math.round(innerHeight * 0.8)) + "px"; };
    champ.addEventListener("input", grandir); grandir();
    if(!x.depart){ const k = champ.value.indexOf("    \n    return"); if(k >= 0) champ.addEventListener("pointerup", () => { if(champ.value === SQUELETTE_C && champ.selectionStart === champ.selectionEnd) champ.setSelectionRange(k + 4, k + 4); }, {once:true}); }
    metriques(); peindre();
    /* Entrée : garde l'indentation (+4 après « { ») ; « } » en début de ligne : retire 4 espaces */
    champ.addEventListener("keydown", e => {
      if(champ.readOnly) return;
      const v0 = champ.value, a = champ.selectionStart, b = champ.selectionEnd;
      if(e.key === "Enter" && !e.ctrlKey && !e.metaKey && !e.shiftKey){
        const debut = v0.lastIndexOf("\n", a - 1) + 1, ligne = v0.slice(debut, a);
        let ind = (ligne.match(/^[ \t]*/) || [""])[0];
        if(/\{\s*$/.test(ligne)) ind += "    ";
        e.preventDefault(); champ.setRangeText("\n" + ind, a, b, "end"); peindre();
      }else if(e.key === "}" && a === b){
        const debut = v0.lastIndexOf("\n", a - 1) + 1, avant = v0.slice(debut, a);
        if(/^ {4,}$/.test(avant)){ e.preventDefault(); champ.setRangeText(avant.slice(4) + "}", debut, a, "end"); peindre(); }
      }else if(e.key === "Tab" && !e.shiftKey){
        e.preventDefault(); champ.setRangeText("    ", a, b, "end"); peindre();
      }
    });
    workerC();   /* préchauffage du moteur */
    const zone = cont.querySelector(".c-zone"), stdin = cont.querySelector(".c-stdin");
    cont.querySelector("[data-a=executer]").onclick = async () => {
      zone.innerHTML = `<p class="vide-txt">exécution…</p>`;
      const r = await executerC(champ.value, stdin.value);
      zone.innerHTML = r.ok ? `<div class="c-sortie">${blocC("Ton programme affiche", r.out)}</div>`
        : `<p class="erreur-txt">${esc(messageC(r.err))}</p>${r.out ? `<div class="c-sortie">${blocC("Affiché avant l'erreur", r.out)}</div>` : ""}`;
    };
  }
  if(champ.tagName === "TEXTAREA") champ.addEventListener("keydown", e => {
    if(e.key === "Tab" && !e.shiftKey && (mode === "sql" || mode === "dom")){ e.preventDefault(); const s = champ.selectionStart; champ.setRangeText("  ", s, champ.selectionEnd, "end"); }
  });
  return o;
}
/* indices : −30 % d'XP chacun, max réglable (2 par défaut) */
function brancherIndices(cont, liste, onUse){
  liste = (liste || []).filter(Boolean);
  const max = Math.min(liste.length, V().indicesMax);
  let n = 0;
  if(!max){ cont.innerHTML = ""; return () => 0; }
  const rendre = () => {
    cont.innerHTML = liste.slice(0, n).map((h, k) => `<div class="indice"><small>Indice ${k+1}</small>${md(h)}</div>`).join("")
      + (n < max ? `<button type="button" class="lien" data-a="indice">${ic("bulb")} ${n ? "Encore un indice" : "Un indice ?"} (−${Math.round(V().indiceCout*100)} % d'XP)</button>` : "");
    const b = cont.querySelector("[data-a=indice]");
    if(b) b.onclick = () => { n++; onUse && onUse(n); rendre(); };
  };
  rendre();
  return () => n;
}
function corrigeDe(x, v){
  v = v || {};
  if(x.corrige) return md(x.corrige);
  const att = [].concat(v.attendu ?? []);
  switch(v.mode){
    case "exact": return att.length ? `<code>${esc(att[0])}</code>` + (att.length > 1 ? ` <small>(aussi accepté : ${att.slice(1).map(a => `<code>${esc(a)}</code>`).join(", ")})</small>` : "") : "";
    case "numerique": return `<code>${esc(fmt(+v.attendu))}${v.unite ? " " + esc(v.unite) : ""}</code>` + (v.tol ? ` <small>(± ${esc(fmt(+v.tol))})</small>` : "");
    case "regex": return v.exemple ? `<code>${esc(v.exemple)}</code>` : "";
    case "sql": return `<pre class="code"><code>${esc(v.attendu || "")}</code></pre>`;
    case "c": return v.exemple ? `<pre class="code"><code>${esc(v.exemple)}</code></pre>` : "";
    default: return "";
  }
}

/* =====================================================================
   JOUEURS D'ITEMS (renvoient une promesse résolue à la fin de l'item)
   ===================================================================== */
function jouerQuestion(it, zone, opts = {}){
  return new Promise(resolve => {
    const v = it.verif || {mode:"auto"};
    const t0 = Date.now(); let fini = false, nIndices = () => 0, donnee = "";
    zone.innerHTML = `<article class="q" data-type="${esc(it.type)}">
      ${teteItem(it, opts)}
      <div class="q-enonce">${md(it.enonce)}</div>
      <div class="q-corps"></div>
      <div class="q-indices"></div>
      <div class="q-retour" hidden></div>
      <div class="actions q-actions"></div>
    </article>`;
    const art = zone.firstElementChild, corps = art.querySelector(".q-corps"), act = art.querySelector(".q-actions"), ret = art.querySelector(".q-retour");

    function terminer(ok, extra = {}){
      if(fini) return; fini = true; S.touches = null;
      if(opts.log) opts.log.push({it, etape:null, donnee, ok});
      const d = M.reponse(it.id, ok, (Date.now() - t0)/1000, {indices:nIndices(), bulle:!opts.examen});
      art.classList.add(ok ? "juste" : "rate");
      if(opts.examen){ resolve({ok, d}); return; }
      ret.hidden = false; ret.className = "q-retour " + (ok ? "ok" : "ko");
      const cor = !ok && it.type === "saisie" ? corrigeDe(it, v) : "";
      ret.innerHTML = `<b class="verdict">${ok ? "✓ Juste" : "✗ Raté"}${d && ok ? ` <small>+${nf(d.xp + d.bonus)} XP</small>` : ""}</b>
        ${extra.msg ? `<p>${esc(extra.msg)}</p>` : ""}
        ${cor ? `<div class="corrige"><small>Réponse attendue</small>${cor}</div>` : ""}
        ${extra.sortie || ""}
        ${it.explication ? `<div class="explication">${md(it.explication)}</div>` : ""}`;
      act.innerHTML = `<button type="button" class="btn plein" data-a="suivant">${opts.dernier ? "Terminer" : "Suivant"} ⏎</button>${lienSignaler(it.id)}`;
      const suivant = () => { S.touches = null; resolve({ok, d}); };
      const bs = act.querySelector("[data-a=suivant]");
      bs.onclick = suivant;
      setTimeout(() => { if(bs.isConnected) bs.focus({preventScroll:true}); }, 60);   /* Entrée = Suivant */
      ret.scrollIntoView({block:"nearest", behavior:reduit ? "auto" : "smooth"});
    }

    if(it.type === "qcm" || it.type === "qcm-multi"){
      const multi = it.type === "qcm-multi", choix = it.choix || [];
      const att = [].concat((it.verif && it.verif.attendu) ?? it.bonnes ?? it.bonne ?? []);
      const bonnes = new Set(att.map(a => typeof a === "number" ? a : choix.findIndex(c => norm(c) === norm(a))).filter(i => i >= 0));
      const ordre = melanger(choix.map((_, i) => i));
      corps.innerHTML = `<div class="attente-choix" aria-label="Les choix arrivent"><i></i><span>choix dans 2 s… lis bien la question</span></div>`;
      act.innerHTML = lienSignaler(it.id);
      setTimeout(() => {
        if(fini || !art.isConnected) return;
        corps.innerHTML = `<div class="choix${multi ? " multi" : ""}" role="group">${ordre.map((i, k) => `<button type="button" data-i="${i}" aria-pressed="false"><span class="k">${k < 9 ? k+1 : ""}</span><span class="t">${mdInline(choix[i])}</span></button>`).join("")}</div>
          ${multi ? `<small class="aide">Plusieurs bonnes réponses : coche-les toutes (tout juste ou 0).</small>` : ""}`;
        const btns = [...corps.querySelectorAll("[data-i]")];
        const corriger = () => {
          const pris = new Set(btns.filter(b => b.getAttribute("aria-pressed") === "true").map(b => +b.dataset.i));
          const ok = pris.size === bonnes.size && [...pris].every(i => bonnes.has(i));
          donnee = [...pris].map(i => choix[i]).join(" · ");
          btns.forEach(b => { const i = +b.dataset.i; b.disabled = true; if(bonnes.has(i)) b.classList.add("bonne"); else if(pris.has(i)) b.classList.add("fausse"); });
          terminer(ok);
        };
        const choisir = b => {
          if(fini) return;
          if(multi) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
          else { b.setAttribute("aria-pressed", "true"); corriger(); }
        };
        btns.forEach(b => b.onclick = () => choisir(b));
        if(multi){
          act.innerHTML = `<button type="button" class="btn plein" data-a="valider">Valider ⏎</button>${lienSignaler(it.id)}`;
          act.querySelector("[data-a=valider]").onclick = corriger;
        }
        S.touches = e => {
          const n = +e.key; if(n >= 1 && n <= btns.length && n <= 9){ e.preventDefault(); choisir(btns[n-1]); }
          else if(e.key === "Enter" && multi){ e.preventDefault(); corriger(); }
        };
      }, opts.sansAttente ? 0 : 2000);
      return;
    }

    if(it.type === "trous"){
      const att = [].concat((it.verif && it.verif.attendu) ?? []), nb = (String(it.enonce).match(/\[_\]/g) || []).length, vals = Array(nb).fill(null);
      let sel = null;
      const rendreT = fb => {
        let k = 0;
        art.querySelector(".q-enonce").innerHTML = md(it.enonce).replace(/\[_\]/g, () => { const i = k++, v = vals[i]; return `<span class="trou${fb ? (norm(v) === norm(att[i]) ? " ok" : " ko") : ""}" data-t="${i}">${v ? mdInline(v) : "&nbsp;&nbsp;&nbsp;&nbsp;"}</span>`; });
        corps.innerHTML = `<div class="banque">${(it.fragments || []).map((f2, j) => `<button type="button" class="frag${sel === f2 ? " sel" : ""}" ${fb ? "disabled" : ""} data-f="${j}">${mdInline(f2)}</button>`).join("")}</div>${fb ? "" : `<small class="aide">Glisse un fragment dans un trou (ou touche le fragment, puis le trou).</small>`}`;
        if(fb) return;
        act.innerHTML = `<button type="button" class="btn plein" data-a="valider" ${vals.every(Boolean) ? "" : "disabled"}>Valider ⏎</button>${lienSignaler(it.id)}`;
        act.querySelector("[data-a=valider]").onclick = valider;
        corps.querySelectorAll("[data-f]").forEach(b => {
          const texte = (it.fragments || [])[+b.dataset.f];
          b.addEventListener("pointerdown", e => {
            if(fini) return; e.preventDefault();
            const x0 = e.clientX, y0 = e.clientY; let fantome = null;
            const move = ev => {
              if(!fantome && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6){ fantome = b.cloneNode(true); fantome.classList.add("frag-fantome"); document.body.appendChild(fantome); }
              if(fantome){ fantome.style.left = ev.clientX + "px"; fantome.style.top = ev.clientY + "px"; }
            };
            const up = ev => {
              removeEventListener("pointermove", move); removeEventListener("pointerup", up);
              if(fantome){ fantome.remove(); const t = document.elementFromPoint(ev.clientX, ev.clientY), tr = t && t.closest(".trou"); if(tr){ vals[+tr.dataset.t] = texte; sel = null; rendreT(false); } }
              else { sel = sel === texte ? null : texte; rendreT(false); }
            };
            addEventListener("pointermove", move); addEventListener("pointerup", up);
          });
        });
        art.querySelectorAll(".trou").forEach(tr => tr.addEventListener("click", () => { if(fini) return; const i = +tr.dataset.t; if(sel){ vals[i] = sel; sel = null; } else vals[i] = null; rendreT(false); }));
      };
      const valider = () => {
        if(fini || !vals.every(Boolean)) return;
        donnee = vals.join(" · ");
        const ok = vals.every((v, i) => norm(v) === norm(att[i]));
        rendreT(true); terminer(ok);
      };
      S.touches = e => { if(e.key === "Enter"){ e.preventDefault(); valider(); } };
      rendreT(false);
      return;
    }

    /* saisie */
    const ctx = {module:S.mod.id, chapitre:S.chapDe[it.id]};
    const champ = creerChamp(corps, v, Object.assign({}, it, {ctx}));
    nIndices = brancherIndices(art.querySelector(".q-indices"), it.indices);
    const valider = async () => {
      if(fini) return;
      const rep = champ.lire(); donnee = rep;
      if(v.mode !== "auto" && !rep.trim()){ champ.el.classList.add("secoue"); setTimeout(() => champ.el.classList.remove("secoue"), 400); return; }
      if(v.mode === "auto" || !v.mode){ autoEval(); return; }
      act.querySelectorAll("button").forEach(b => b.disabled = true);
      const r = await verifier(v, rep, ctx, champ);
      champ.el.readOnly = true;
      terminer(!!r.ok, r);
    };
    const autoEval = () => {
      champ.el.readOnly = true; S.touches = null; donnee = "(auto-évalué)";
      ret.hidden = false; ret.className = "q-retour auto";
      ret.innerHTML = `<div class="corrige"><small>Correction</small>${corrigeDe(it, v) || md(it.explication || "")}</div><p>Honnêtement, tu avais juste ?</p>`;
      act.innerHTML = `<button type="button" class="btn plein" data-a="oui">J'avais juste</button><button type="button" class="btn" data-a="non">J'avais faux</button>`;
      act.querySelector("[data-a=oui]").onclick = () => terminer(true);
      act.querySelector("[data-a=non]").onclick = () => terminer(false);
    };
    act.innerHTML = `<button type="button" class="btn plein" data-a="valider">${v.mode === "auto" ? "Voir la correction" : "Valider ⏎"}</button>
      <button type="button" class="btn" data-a="passe">Je ne sais pas</button>${lienSignaler(it.id)}`;
    act.querySelector("[data-a=valider]").onclick = valider;
    act.querySelector("[data-a=passe]").onclick = () => { champ.el.readOnly = true; terminer(false); };
    champ.el.addEventListener("keydown", e => {
      if(e.key === "Enter" && (!champ.multi || e.ctrlKey || e.metaKey)){ e.preventDefault(); valider(); }
    });
    champ.focus();
  });
}

/* exo long : une réponse au moteur par étape, chrono par étape */

    </article>`;
    const art = zone.firstElementChild, ol = art.querySelector(".etapes"), actFin = art.querySelector(".q-actions"), ret = art.querySelector(".q-retour");
    const somme = d => { if(d && d.ok) xp += d.xp + d.bonus; };
    const bDe = actFin.querySelector("[data-a=de]"); if(bDe) bDe.onclick = () => { M.finExo(it.id); S.nettoyer = null; resolve({relance:true}); opts.relancer(); };
    const zSch = art.querySelector(".exo-schema");
    const majSchema = e => { if(!zSch) return; const es = e && e.schema; zSch.innerHTML = es && (es.modele || es.el) ? SV.rendre(es) : SV.rendre(it.schema, es || {}); };

    function etape(){
      if(k >= n) return finir();
      const e = etapes[k], v = e.verif || {mode:"auto"}, t0 = Date.now();
      majSchema(e);
      const rat = opts.aRattraper && opts.aRattraper.includes(k);
      let koLogue = false, close = false;
      const li = document.createElement("li"); li.className = "etape courante";
      const dEt = e.duree != null ? +e.duree * (dTot / ((+it.duree) || dTot || 1)) : dTot / n;
      li.innerHTML = `<div class="etape-tete"><span class="num">Étape ${k+1}/${n}</span><small>≈ ${minutes(dEt)}</small>${rat ? `<span class="pastille todo">À rattraper · ×${fmt(V().rattrapage)}</span>` : ""}</div>
        ${e.consigne ? `<div class="q-enonce">${md(e.consigne)}</div>` : ""}
        <div class="q-corps"></div><div class="q-indices"></div><div class="etape-msg" role="status"></div><div class="actions"></div>`;
      ol.appendChild(li);
      const corps = li.querySelector(".q-corps"), msg = li.querySelector(".etape-msg"), act = li.querySelector(".actions");
      const champ = creerChamp(corps, v, Object.assign({}, e, {ctx}));
      const nIndices = brancherIndices(li.querySelector(".q-indices"), e.indices);
      const secs = () => (Date.now() - t0)/1000;
      const rep = ok => M.reponse(it.id, ok, secs(), {etape:k, indices:ok ? nIndices() : 0, run, mode:opts.mode || "guide"});
      const fermer = (ok, contenu = "") => {
        if(close) return; close = true;
        if(opts.log) opts.log.push({it, etape:k, donnee:champ.lire(), ok});
        li.className = "etape " + (ok ? "faite" : "ratee"); champ.el.readOnly = true;
        li.querySelectorAll("[data-a=indice], [data-a=executer]").forEach(b => b.disabled = true);
        act.innerHTML = "";
        msg.innerHTML = contenu; k++; etape();
      };
      const bilanEtape = (ok, extra = {}) => `<b class="verdict">${ok ? "✓ Étape validée" : "✗ Étape ratée"}</b>${extra.msg ? `<p>${esc(extra.msg)}</p>` : ""}
        ${!ok && corrigeDe(e, v) ? `<div class="corrige"><small>Correction</small>${corrigeDe(e, v)}</div>` : ""}${extra.sortie || ""}${e.explication ? `<div class="explication">${md(e.explication)}</div>` : ""}`;
      const valider = async () => {
        if(close) return;
        if(v.mode === "auto" || !v.mode) return montrerCorrection(true);
        if(!champ.lire().trim()){ champ.el.classList.add("secoue"); setTimeout(() => champ.el.classList.remove("secoue"), 400); return; }
        const bv = act.querySelector("[data-a=valider]"); bv.disabled = true;
        const r = await verifier(v, champ.lire(), ctx, champ);
        bv.disabled = false;
        if(r.ok){ const d = rep(true); somme(d); nOk++; fermer(true, bilanEtape(true, r)); }
        else {
          if(!koLogue){ koLogue = true; rep(false); }   /* seul le 1er essai raté compte pour la précision */
          msg.innerHTML = `<p class="erreur-txt">✗ Pas encore. ${esc(r.msg || "")}</p>${r.sortie || ""}<small class="aide">Tu peux corriger et revalider, ou voir la correction.</small>`;
        }
      };
      const montrerCorrection = auto => {
        act.innerHTML = "";
        msg.innerHTML = `<div class="corrige"><small>Correction</small>${corrigeDe(e, v) || md(e.explication || "") || "<p>(pas de corrigé dans la banque)</p>"}</div>`
          + (auto ? `<p>Honnêtement, tu avais juste ?</p>` : "");
        if(auto){
          act.innerHTML = `<button type="button" class="btn plein" data-a="oui">J'avais juste</button><button type="button" class="btn" data-a="non">J'avais faux</button>`;
          act.querySelector("[data-a=oui]").onclick = () => { const d = rep(true); somme(d); nOk++; fermer(true, msg.innerHTML.replace(/<p>Honnêtement.*<\/p>/, "") + `<b class="verdict">✓ Auto-évaluée juste</b>`); };
          act.querySelector("[data-a=non]").onclick = () => { if(!koLogue) rep(false); fermer(false, msg.innerHTML.replace(/<p>Honnêtement.*<\/p>/, "")); };
        } else {
          if(!koLogue){ koLogue = true; rep(false); }
          act.innerHTML = `<button type="button" class="btn plein" data-a="suite">Étape suivante</button>`;
          act.querySelector("[data-a=suite]").onclick = () => fermer(false, bilanEtape(false));
        }
      };
      act.innerHTML = `<button type="button" class="btn plein" data-a="valider">${v.mode === "auto" || !v.mode ? "Voir la correction" : "Valider l'étape"}</button>`
        + (v.mode && v.mode !== "auto" ? `<button type="button" class="btn" data-a="secher">Je sèche : correction</button>` : "");
      act.querySelector("[data-a=valider]").onclick = valider;
      const bs = act.querySelector("[data-a=secher]"); if(bs) bs.onclick = () => montrerCorrection(false);
      champ.el.addEventListener("keydown", ev => { if(ev.key === "Enter" && (!champ.multi || ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); valider(); } });
      if(k > 0) li.scrollIntoView({block:"start", behavior:reduit ? "auto" : "smooth"});
      champ.focus();
    }
    function finir(){
      M.finExo(it.id); S.nettoyer = null; majSchema(null);
      ret.hidden = false; ret.className = "q-retour " + (nOk === n ? "ok" : "ko");
      ret.innerHTML = `<b class="verdict">${nOk === n ? "✓ Exo validé" : `Exo terminé : ${nOk}/${n} étape${n > 1 ? "s" : ""} réussie${nOk > 1 ? "s" : ""}`} <small>+${nf(xp)} XP</small></b>
        ${it.explication ? `<div class="explication">${md(it.explication)}</div>` : ""}
        ${nOk < n ? `<small class="aide">Refais-le plus tard : les 3 premiers passages comptent plein pot.</small>` : ""}`;
      actFin.innerHTML = `<button type="button" class="btn plein" data-a="fin">${opts.dernier || !opts.examen ? "Terminer" : "Suivant"}</button>${opts.relancer ? `<button type="button" class="btn" data-a="de2">${ic("dice")} Même exo, autres valeurs</button>` : ""}${lienSignaler(it.id)}`;
      const bDe2 = actFin.querySelector("[data-a=de2]"); if(bDe2) bDe2.onclick = () => { resolve({relance:true}); opts.relancer(); };
      const bf = actFin.querySelector("[data-a=fin]");
      bf.onclick = () => resolve({ok:nOk === n, partiel:nOk, n, xp});
      setTimeout(() => bf.isConnected && bf.focus({preventScroll:true}), 60);
      ret.scrollIntoView({block:"nearest", behavior:reduit ? "auto" : "smooth"});
    }
    etape();
  });
}
const jouer = (it, zone, opts) => it.type === "exo" ? jouerExo(it, zone, opts) : jouerQuestion(it, zone, opts);

/* =====================================================================
   NOTIONS : parcours continu (format baseline `notions[]`)
   + compatibilité des anciens chapitres (fiche / parcours) pendant la migration
   ===================================================================== */
const normT = s => norm(String(s ?? "").replace(/\$/g, ""));
function normaliser(c){
  const ord = c.ordre ?? 0;
  if(!Array.isArray(c.notions)){
    const F = c.fiche || [], P = c.parcours || [], ns = [];
    F.forEach((f, k) => ns.push({id:`${ord}.${k+1}`, titre:f.titre, corps:f.contenu, schema:f.schema, labo:f.labo, pre:[], ecrans:[], check:null}));
    P.forEach((p, k) => {
      const t = normT(p.notion);
      let n = ns.find(x => !x.check && x.titre && (normT(x.titre).includes(t) || t.includes(normT(x.titre))));
      if(!n){ n = {id:`${ord}.${ns.length+1}`, titre:p.notion, corps:"", pre:[], ecrans:[]}; ns.push(n); }
      n.schemaFa = p.schema; n.ecrans = p.ecrans || [];
      n.check = p.controle ? Object.assign({}, p.controle, {id:p.controle.id || `${c.id}-ctl-${k}`}) : null;
    });
    c.notions = ns;
  }
  c.notions.forEach((n, k) => { n.ch = c.id; n.k = k; n.pre = n.pre || []; n.ecrans = n.ecrans || []; if(!n.schemaFa) n.schemaFa = n.schema; });
}
function indexerNotions(){
  S.notions = S.chapitres.flatMap(c => c.notions);
  S.notionParId = Object.fromEntries(S.notions.map(n => [n.id, n]));
  for(const c of S.chapitres) for(const it of c.items || []){
    let n = S.notionParId[it.notion];
    if(!n || n.ch !== c.id){
      const t = normT(it.notion);
      n = t ? (c.notions.find(x => normT(x.titre) === t) || c.notions.find(x => { const u = normT(x.titre); return u && (u.includes(t) || t.includes(u)); })) : null;
      n = n || c.notions[0];
    }
    it._n = n ? n.id : null;
  }
}
const ckId = n => n.check ? (n.check.id || `${n.ch}-ctl-${n.k}`) : null;
const controles = () => new Set((M.etat() || {}).controles || []);
const lue = (n, ctl = controles()) => !!n.check && ctl.has(ckId(n));
const titreNotion = id => { const n = S.notionParId[id]; return n ? `${id} ${n.titre}` : id; };

/* erreurs : questions dont la dernière réponse est fausse + étapes d'exo dont la dernière réponse est fausse */
function erreursExos(){
  const res = M.etat(), det = (res && res.details) || {}, last = {}, out = {};
  const evs = M.evenements().filter(e => det[e.i] && S.items[e.q] && S.items[e.q].type === "exo").sort((a, b) => a.t - b.t);
  for(const e of evs) (last[e.q] = last[e.q] || {})[e.e || 0] = det[e.i].ok;
  for(const [q, m] of Object.entries(last)){ const bad = Object.entries(m).filter(([, ok]) => !ok).map(([k]) => +k); if(bad.length) out[q] = bad; }
  return out;
}
const itemsNotions = (ids, pred = () => true) => S.chapitres.flatMap(c => (c.items || []).filter(it => it.type !== "examen" && ids.has(it._n) && pred(it)));
const tousIds = () => new Set(S.notions.map(n => n.id));
function statNotion(n, st, ee){
  const its = itemsNotions(new Set([n.id]));
  const faits = its.filter(it => it.type === "exo" ? (st[it.id] && st[it.id].valide) : (st[it.id] && st[it.id].ok)).length;
  const err = its.filter(it => it.type === "exo" ? ee[it.id] : (st[it.id] && st[it.id].erreur)).length;
  return {tot:its.length, faits, err};
}
function nbErreurs(){ const st = etats(), ee = erreursExos(); return S.notions.reduce((a, n) => a + statNotion(n, st, ee).err, 0); }
function progression(){
  const ctl = controles(), avecCheck = S.notions.filter(n => n.check), lues = avecCheck.filter(n => lue(n, ctl));
  return {lues:lues.length, total:avecCheck.length, pct:avecCheck.length ? Math.round(lues.length/avecCheck.length*100) : 0, suivante:avecCheck.find(n => !lue(n, ctl)) || S.notions[0]};
}

/* références « cf. 2.1 » / « cf. ch. 3 » : {{2.1}} et {{ch3}} dans le texte riche */
function cf(id){ const n = S.notionParId[id]; return `<button type="button" class="cf" data-m="cf" data-id="${esc(id)}" title="${esc(n ? n.id + " " + String(n.titre).replace(/\$/g, "") : id)}">cf. ${esc(id)}</button>`; }
function xref(html){
  return html.replace(/\{\{(ch)?(\d+(?:\.\d+)?)\}\}/g, (m, c, id) => {
    if(c){ const ch = S.chapitres.find(x => String(x.ordre ?? 0) === id), n = ch && ch.notions[0]; return n ? `<button type="button" class="cf" data-m="cf" data-id="${esc(n.id)}" title="Chapitre ${esc(id)}">cf. ch. ${esc(id)}</button>` : m; }
    return S.notionParId[id] ? cf(id) : m;
  });
}
const riche = s => xref(md(s));

/* ---------- Cours · Explicatif : scroll continu, sommaire qui suit la lecture ---------- */
function carteCheck(n, ctxe){
  if(!n.check) return "";
  const id = ckId(n), q = n.check, ctl = lue(n), vis = S2.chkV[id], eng = S2.eng === id;
  const gain = ctl ? "" : `<span class="pastille">+${V().controle} XP à la 1re réussite</span>`;
  const train = `<div class="apres"><p>Envie de t'entraîner sur cette notion ?</p><button type="button" class="btn plein" data-m="train" data-id="${esc(n.id)}">S'entraîner · ${esc(n.id)}</button></div>`;
  if(ctl && !vis) return `<div class="check-carte valide" id="c-${esc(id)}" data-id="${esc(id)}"><p class="ck-k">${ic("check")} Notion validée</p>${train}</div>`;
  if(ctxe === "expl" && !vis && !eng)
    return `<div class="check-carte repli" id="c-${esc(id)}" data-m="eng" data-id="${esc(id)}" tabindex="0" role="button"><p class="ck-k">${ic("check")} Check de validation ${gain}</p><div class="ck-ligne"><span>Prêt à valider cette notion ?</span><span class="btn plein">Afficher la question</span></div></div>`;
  const ch2 = q.choix || [], bon = [].concat(q.verif ? q.verif.attendu : q.attendu).map(a => typeof a === "number" ? a : ch2.findIndex(x => norm(x) === norm(a)));
  const ordre = S2.ord[id] || (S2.ord[id] = melanger(ch2.map((_, k) => k)));
  const fini = !!vis;
  return `<div class="check-carte${eng ? " actif" : ""}" id="c-${esc(id)}" data-id="${esc(id)}">
    <p class="ck-k">${ic("check")} Check de validation ${gain}</p>
    <div class="q-enonce">${riche(q.enonce)}</div>
    <div class="choix">${ordre.map(k => `<button type="button" ${fini ? "disabled" : ""} class="${fini && vis.ok && bon.includes(k) ? "bonne" : fini && !vis.ok && vis.pick === k ? "fausse" : ""}" data-m="ck" data-id="${esc(id)}" data-i="${k}"><span class="t">${mdInline(ch2[k])}</span></button>`).join("")}</div>
    ${fini ? `<div class="q-retour ${vis.ok ? "ok" : "ko"}"><b class="verdict">${vis.ok ? "✓ Exact" : "✗ Pas tout à fait"}</b>${q.explication ? `<div class="explication">${md(q.explication)}</div>` : ""}</div>${vis.ok ? "" : `<div class="actions"><button type="button" class="btn" data-m="retry" data-id="${esc(id)}">Réessayer</button><small class="vide-txt">La notion sera validée quand tu auras réussi.</small></div>`}` : (ctxe === "expl" ? `<p class="vide-txt ck-aide">Choisis ta réponse · touche en dehors pour reprendre la lecture.</p>` : "")}
  </div>${fini && vis.ok ? train : ""}`;
}
function majCarte(n, ctxe){

function notionHtml(n){

function rendreExplicatif(box){

function monterLabos(box){ box.querySelectorAll("[data-labo]").forEach(el => { const f = EXT.labos[el.dataset.labo]; if(f) try{ f(el, {SV, esc, fmt, ic}); }catch(e){ el.textContent = "(labo indisponible)"; } }); }
function allerNotion(id){

/* « spy » : notion courante dans le sommaire ; le flou se coupe si la carte active sort de l'écran */
function spy(){
  const veille = document.body.classList;

/* libellé court de la sélection : « tout le module », « Ch. 3 » si un chapitre est coché en entier, sinon les ids (4 max, puis +N) */
function libSel(){
  const p = S2.fl.pick, parts = [];
  if(S.notions.length && S.notions.every(n => p.has(n.id))) return "tout le module";
  for(const c of S.chapitres){
    const pris = c.notions.filter(n => p.has(n.id));
    if(!pris.length) continue;
    if(pris.length === c.notions.length) parts.push(`Ch. ${c.ordre ?? 0}`); else parts.push(...pris.map(n => n.id));
  }
  return parts.length > 4 ? parts.slice(0, 4).join(" · ") + ` +${parts.length - 4}` : parts.join(" · ");

const MODES = {express:"Express", classique:"Classique", mock:"Mock"};
